server:
  port: 0

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
          product-service:
            loggerLevel: BASIC
          inventory-service:
            connectTimeout: 1500
            readTimeout: 3000
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - ru.yandex.practicum.order.exception.RemoteBusinessException
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

logging:
  level:
    ru.yandex.practicum.order.feign.ProductClient: DEBUG
